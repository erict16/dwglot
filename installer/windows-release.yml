name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm Dwglot.spec
          if (-not (Test-Path "dist\Dwglot.exe")) { throw "Dwglot.exe missing" }
          if (-not (Test-Path "dist\dwglot-cli.exe")) { throw "dwglot-cli.exe missing" }

      - name: Inno Setup 6
        run: choco install innosetup --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "installer\Dwglot_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path "installer\Output\Dwglot_v0.1.0_Setup.exe")) {
            throw "Dwglot_v0.1.0_Setup.exe missing"
          }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          name: 图译 Dwglot v0.1.0
          files: installer/Output/Dwglot_v0.1.0_Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
