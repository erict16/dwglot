name: macOS installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version
        id: ver
        run: |
          version="$(python installer/pack_version.py)"
          if [ -z "$version" ]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt

      - name: PyInstaller + DMG
        run: python installer/build_macos.py --skip-frontend --dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_*.dmg

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 图译 Tuyi v${{ steps.ver.outputs.version }}
          files: dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
