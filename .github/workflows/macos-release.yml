name: macOS installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version
        id: ver
        run: |
          version="$(python installer/pack_version.py)"
          if [ -z "$version" ]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt httpx

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: PyInstaller + DMG
        run: |
          identity="${{ secrets.MACOS_SIGN_IDENTITY }}"
          if [ -n "$identity" ]; then
            python installer/build_macos.py --skip-frontend --dmg --identity "$identity"
          else
            python installer/build_macos.py --skip-frontend --dmg
          fi

      - name: Appcast
        if: matrix.arch == 'arm64'
        run: |
          dmg=(dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_*.dmg)
          APP_VERSION="${{ steps.ver.outputs.version }}" DMG="${dmg[0]}" python tools/gen_appcast.py

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_*.dmg
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_*.zip
            dist/appcast.xml

      - name: GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 图译 Tuyi v${{ steps.ver.outputs.version }}
          files: |
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_*.dmg
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_*.zip
            dist/appcast.xml
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
