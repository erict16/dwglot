name: macOS installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm runner arch
        run: |
          machine="$(uname -m)"
          echo "uname=$machine matrix=${{ matrix.arch }}"
          if [ "$machine" != "${{ matrix.arch }}" ]; then
            echo "Runner is $machine, expected ${{ matrix.arch }}" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm Python arch
        run: |
          python - <<'PY'
          import platform, sys
          machine = platform.machine()
          expected = "${{ matrix.arch }}"
          print("python", sys.version.split()[0], machine)
          if machine != expected:
              raise SystemExit(f"Python is {machine}, expected {expected}")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version
        id: ver
        run: |
          version="$(python installer/pack_version.py)"
          if [ -z "$version" ]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt httpx

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: PyInstaller + DMG
        run: |
          identity="${{ secrets.MACOS_SIGN_IDENTITY }}"
          if [ -n "$identity" ]; then
            python installer/build_macos.py --skip-frontend --dmg --identity "$identity"
          else
            python installer/build_macos.py --skip-frontend --dmg
          fi
          dmg="dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_${{ matrix.arch }}.dmg"
          zip="dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_${{ matrix.arch }}.zip"
          if [ ! -f "$dmg" ] || [ ! -f "$zip" ]; then
            echo "Missing $dmg or $zip" >&2
            ls -l dist || true
            exit 1
          fi

      - name: Appcast
        if: matrix.arch == 'arm64'
        run: |
          APP_VERSION="${{ steps.ver.outputs.version }}" \
            DMG="dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_arm64.dmg" \
            python tools/gen_appcast.py

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_${{ matrix.arch }}.dmg
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_${{ matrix.arch }}.zip
            dist/appcast.xml

      - name: GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 图译 Tuyi v${{ steps.ver.outputs.version }}
          files: |
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_${{ matrix.arch }}.dmg
            dist/Tuyi_v${{ steps.ver.outputs.version }}_macOS_${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release appcast
        if: (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && matrix.arch == 'arm64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          files: dist/appcast.xml
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
