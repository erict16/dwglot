name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $version = (python installer/pack_version.py).Trim()
          if (-not $version) { throw "APP_VERSION is empty" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $($env:GITHUB_REF_NAME) does not match APP_VERSION $version"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller httpx

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm Dwglot.spec
          if (-not (Test-Path "dist\Tuyi\Tuyi.exe")) { throw "Tuyi.exe missing" }
          if (-not (Test-Path "dist\Tuyi\tuyi-cli.exe")) { throw "tuyi-cli.exe missing" }
          if (-not (Test-Path "dist\Tuyi\_internal")) { throw "_internal runtime missing" }

      - name: Update zip
        run: python installer/pack_update_zip.py

      - name: Inno Setup 6
        run: choco install innosetup --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=$version" "installer\Dwglot_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path "installer\Output\Tuyi_v${version}_Setup.exe")) {
            throw "Tuyi_v${version}_Setup.exe missing"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            installer/Output/Tuyi_v${{ steps.ver.outputs.version }}_Setup.exe
            dist/Tuyi_v${{ steps.ver.outputs.version }}_windows_x64.zip

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 图译 Tuyi v${{ steps.ver.outputs.version }}
          files: |
            installer/Output/Tuyi_v${{ steps.ver.outputs.version }}_Setup.exe
            dist/Tuyi_v${{ steps.ver.outputs.version }}_windows_x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
