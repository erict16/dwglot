<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C · 极短 — 图译</title>
  <link rel="icon" href="../../landing/shots/mark.png" />
  <style>
    :root {
      --bg: #faf9f6;
      --ink: #111;
      --muted: #6b6660;
      --line: rgba(20, 16, 10, .1);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .draft {
      display: flex; justify-content: space-between; padding: 8px 20px;
      background: #1d1d1f; color: #fff; font-size: 13px;
    }
    .draft a { color: #fff; opacity: .75; margin-left: 12px; }
    .draft a[aria-current="page"] { opacity: 1; font-weight: 600; }
    main {
      width: min(560px, calc(100% - 40px));
      margin: auto;
      padding: 48px 0 64px;
      text-align: center;
    }
    img.mark { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 44px; letter-spacing: -.045em; margin: 18px 0 8px; font-weight: 600; }
    .lede { color: var(--muted); margin: 0 0 28px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    a.dl {
      display: block; padding: 18px 14px; border-radius: 16px;
      background: var(--ink); color: #fff; font-weight: 600;
      transition: transform .2s var(--ease);
    }
    a.dl:hover { transform: translateY(-2px); }
    a.dl:active { transform: scale(.97); }
    a.dl small { display: block; margin-top: 4px; font-weight: 400; font-size: 12px; opacity: .7; }
    a.ghost {
      grid-column: 1 / -1;
      padding: 14px; border-radius: 16px;
      border: 1px solid var(--line); background: transparent; font-weight: 600;
    }
    .fine { margin-top: 22px; font-size: 13px; color: var(--muted); }
    .fine a { text-decoration: underline; text-underline-offset: 3px; }
    footer {
      padding: 16px 20px 24px; text-align: center; font-size: 13px; color: var(--muted);
    }
    @media (max-width: 520px) { .pair { grid-template-columns: 1fr; } h1 { font-size: 36px; } }
    html.embed .draft { display: none; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

    </span>
  </div>

      <a class="dl" href="https://github.com/erict16/tuyi/releases">Mac<small>Apple 芯片一份，Intel 一份</small></a>

  </main>
  <footer>v0.1.3 · 安装包未签名</footer>

</html>
