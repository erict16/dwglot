<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图译 icon · 对照</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 15px/1.45 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
      background: #111; color: #ececec; min-height: 100dvh;
    }
    header {
      padding: .7rem 1rem .65rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex; flex-wrap: wrap; gap: .5rem 1.2rem;
      justify-content: space-between; align-items: center;
    }
    h1 { font-size: .95rem; font-weight: 600; }
    .hint { font-size: .72rem; color: #8b8f98; margin-top: .12rem; }
    main { padding: 20px 20px 40px; max-width: 1100px; margin: 0 auto; }
    .stage {
      display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: start;
      margin-bottom: 28px;
    }
    .big {
      width: 256px; height: 256px; border-radius: 58px; overflow: hidden;
      background: #1c1c1e; box-shadow: 0 18px 50px -24px #000;
    }
    .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .meta h2 { font-size: 1.25rem; letter-spacing: -.02em; margin-bottom: 6px; }
    .meta p { color: #8b8f98; font-size: .88rem; max-width: 36em; }
    .sizes { display: flex; gap: 16px; align-items: end; margin-top: 18px; }
    .sz { text-align: center; color: #8b8f98; font-size: 11px; }
    .sz img {
      display: block; margin: 0 auto 6px; border-radius: 22%;
      background: #fff;
    }
    .sz.dark img { background: #2c2c2e; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
    .h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8b8f98; margin: 18px 0 8px; }
    button.tile {
      appearance: none; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: inherit;
      border-radius: 16px; padding: 10px 10px 8px; cursor: pointer; text-align: left;
    }
    button.tile[aria-selected="true"] { background: #fff; color: #111; border-color: #fff; }
    button.tile img {
      width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 22%;
      display: block; background: #fff;
    }
    button.tile span { display: block; margin-top: 7px; font-size: 12px; font-weight: 600; }
    @media (max-width: 720px) {
      .stage { grid-template-columns: 1fr; }
      .big { width: 200px; height: 200px; border-radius: 46px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>图译 icon · 对照</h1>
      <p class="hint">点格子切。方案 1 构图留下了，下面三档是按产品色换的。</p>
    </div>
  </header>
  <main>
    <div class="stage">
      <div class="big"><img id="hero" src="01a-mist.jpg" alt="" /></div>
      <div class="meta">
        <h2 id="title">1a · 雾灰</h2>
        <p id="blurb">方案 1 的构图，底改成软件窗口那种灰，蓝只留在图框顶上一道。我会先用这个。</p>
        <div class="sizes">
          <div class="sz">128<img id="s128" src="01a-mist.jpg" width="128" height="128" alt="" /></div>
          <div class="sz">64<img id="s64" src="01a-mist.jpg" width="64" height="64" alt="" /></div>
          <div class="sz">32<img id="s32" src="01a-mist.jpg" width="32" height="32" alt="" /></div>
          <div class="sz dark">32 暗<img id="s32d" src="01a-mist.jpg" width="32" height="32" alt="" /></div>
        </div>
      </div>
    </div>

    <p class="h">方案 1 换色</p>
    <div class="grid" id="row1"></div>
    <p class="h">其余方向</p>
    <div class="grid" id="row2"></div>
  </main>
  <script>
    const items = [
      { id: "now", src: "00-now.png", title: "现状", blurb: "戴三角帽的小狗。缩到 Dock 上看不出是译图纸。" },
      { id: "1", src: "01-blue.jpg", title: "1 · 原蓝", blurb: "构图可以：图纸、两列、上面探出平面。整块蓝太跳，不像这个软件。" },
      { id: "1a", src: "01a-mist.jpg", title: "1a · 雾灰", blurb: "方案 1 的构图，底改成软件窗口那种灰，蓝只留在图框顶上一道。我会先用这个。" },
      { id: "1b", src: "01b-cream.jpg", title: "1b · 纸色", blurb: "跟现在小狗一个暖纸色。顶栏蓝只剩半截，有点脏。" },
      { id: "1c", src: "01c-white.jpg", title: "1c · 白底", blurb: "跟 landing 一样干净。蓝还是只做顶条。" },
      { id: "2", src: "02-paper.jpg", title: "2 · 图框", blurb: "平面图 + 底下两列对照。最像图纸本身。" },
      { id: "3", src: "03-charcoal.jpg", title: "3 · 炭灰", blurb: "深底上搁一张纸。Dock 上更抢，偏工具软件。" },
      { id: "4", src: "04-blueprint.jpg", title: "4 · 蓝图", blurb: "晒图蓝。好看，不像图译窗口。" },
      { id: "5", src: "05-minimal.jpg", title: "5 · 极简", blurb: "就两列横条。32 像素清楚，但容易看成词典。" },
      { id: "6", src: "06-iso.jpg", title: "6 · 斜放", blurb: "一张斜放的图，图框两列。专业，略复杂。" },
      { id: "7", src: "07-fold.jpg", title: "7 · 折角", blurb: "折角 + 深浅两列。翻译对比最直。" },
      { id: "8", src: "08-stamp.jpg", title: "8 · 章", blurb: "红圈太像瞄准，不像翻译。" },
      { id: "9", src: "09-plan.jpg", title: "9 · 平面", blurb: "上图下对照。底下符号有点花。" },
      { id: "10", src: "10-split.jpg", title: "10 · 对开", blurb: "左原图右译后。意思对，32 像素会糊。" }
    ];
    const row1 = document.getElementById("row1");
    const row2 = document.getElementById("row2");
    const hero = document.getElementById("hero");
    const title = document.getElementById("title");
    const blurb = document.getElementById("blurb");
    const sizes = ["s128", "s64", "s32", "s32d"].map((id) => document.getElementById(id));

    function tile(item) {
      const b = document.createElement("button");
      b.className = "tile";
      b.type = "button";
      b.dataset.id = item.id;
      b.setAttribute("aria-selected", item.id === "1a" ? "true" : "false");
      b.innerHTML = `<img src="${item.src}" alt="" /><span>${item.title}</span>`;
      b.onclick = () => pick(item.id);
      return b;
    }
    items.slice(0, 5).forEach((it) => row1.appendChild(tile(it)));
    items.slice(5).forEach((it) => row2.appendChild(tile(it)));

    function pick(id) {
      const item = items.find((x) => x.id === id);
      document.querySelectorAll("button.tile").forEach((t) => t.setAttribute("aria-selected", t.dataset.id === id ? "true" : "false"));
      hero.src = item.src;
      sizes.forEach((img) => { img.src = item.src; });
      title.textContent = item.title;
      blurb.textContent = item.blurb;
    }
  </script>
</body>
</html>
