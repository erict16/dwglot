<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图译 icon · 对照</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 15px/1.45 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
      background: #111; color: #ececec; min-height: 100dvh;
    }
    header { padding: .7rem 1rem; border-bottom: 1px solid rgba(255,255,255,.08); }
    h1 { font-size: .95rem; }
    .hint { font-size: .72rem; color: #8b8f98; margin-top: .15rem; }
    main { padding: 20px 20px 48px; max-width: 1080px; margin: 0 auto; }
    .stage { display: grid; grid-template-columns: 280px 1fr; gap: 28px; margin-bottom: 24px; }
    .big { width: 256px; height: 256px; border-radius: 58px; overflow: hidden; background: #1c1c1e; }
    .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .meta h2 { font-size: 1.2rem; letter-spacing: -.02em; margin-bottom: 6px; }
    .meta p { color: #8b8f98; font-size: .88rem; max-width: 38em; }
    .sizes { display: flex; gap: 16px; align-items: end; margin-top: 16px; }
    .sz { font-size: 11px; color: #8b8f98; text-align: center; }
    .sz img { display: block; margin: 0 auto 6px; border-radius: 22%; }
    .h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8b8f98; margin: 16px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
    button.tile {
      appearance: none; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: inherit; border-radius: 16px;
      padding: 10px; cursor: pointer; text-align: left;
    }
    button.tile[aria-selected="true"] { background: #fff; color: #111; }
    button.tile img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 22%; display: block; background: #1c1c1e; }
    button.tile span { display: block; margin-top: 7px; font-size: 12px; font-weight: 600; }
    @media (max-width: 720px) { .stage { grid-template-columns: 1fr; } .big { width: 200px; height: 200px; border-radius: 44px; } }
  </style>
</head>
<body>
  <header>
    <h1>图译 icon · 对照</h1>
    <p class="hint">奶油黄丢掉。雾灰 / 白 / 炭黑，平面。图纸 + 挖空三角 + 蓝尺寸。点格子切。</p>
  </header>
  <main>
    <div class="stage">
      <div class="big"><img id="hero" src="flat-mist.jpg" alt="" /></div>
      <div class="meta">
        <h2 id="title">雾灰三角</h2>
        <p id="blurb">窗口那种灰，不是米黄。三角是图译的标记，后面是图纸，蓝十字是译过的尺寸。32 像素还剩三角。</p>
        <div class="sizes">
          <div class="sz">128<img id="s128" src="flat-mist.jpg" width="128" height="128" alt="" /></div>
          <div class="sz">64<img id="s64" src="flat-mist.jpg" width="64" height="64" alt="" /></div>
          <div class="sz">32<img id="s32" src="flat-mist.jpg" width="32" height="32" alt="" /></div>
        </div>
      </div>
    </div>

    <p class="h">这一轮 · 平面</p>
    <div class="grid" id="row"></div>
  </main>
  <script>
    const items = [
      { id: "now", src: "00-now.png", title: "现状", blurb: "剪贴画近景。角色在，格式不对。" },
      { id: "mist", src: "flat-mist.jpg", title: "雾灰三角", blurb: "窗口那种灰，不是米黄。三角是图译的标记，后面是图纸，蓝十字是译过的尺寸。32 像素还剩三角。" },
      { id: "white", src: "flat-white.jpg", title: "白底斜线", blurb: "白底、黑三角、等轴测盒子、一条蓝线。更招贴。" },
      { id: "offset", src: "flat-offset.jpg", title: "两框", blurb: "黑框原文，蓝框译文，错开一层。角上一个小三角。" },
      { id: "dim", src: "flat-dim.jpg", title: "尺寸", blurb: "灰底，房间线稿，底下一条蓝尺寸。三角压在图上。" }
    ];
    const row = document.getElementById("row");
    const hero = document.getElementById("hero");
    const title = document.getElementById("title");
    const blurb = document.getElementById("blurb");
    const sizes = ["s128","s64","s32"].map((id) => document.getElementById(id));

    items.forEach((it) => {
      const b = document.createElement("button");
      b.className = "tile"; b.type = "button"; b.dataset.id = it.id;
      b.setAttribute("aria-selected", it.id === "mist" ? "true" : "false");
      b.innerHTML = `<img src="${it.src}" alt="" /><span>${it.title}</span>`;
      b.onclick = () => pick(it);
      row.appendChild(b);
    });

    function pick(item) {
      document.querySelectorAll("button.tile").forEach((t) =>
        t.setAttribute("aria-selected", t.dataset.id === item.id ? "true" : "false"));
      title.textContent = item.title;
      blurb.textContent = item.blurb;
      hero.src = item.src;
      sizes.forEach((img) => { img.src = item.src; });
    }
  </script>
</body>
</html>
